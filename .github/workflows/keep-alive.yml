name: Supabase Keep Alive

on:
  schedule:
    # Roda a cada 3 dias, ao meio-dia (UTC)
    - cron: '0 12 */3 * *'
  # Permite que você também rode o script manualmente no painel do GitHub
  workflow_dispatch: 

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Acordar o Supabase
        run: |
          curl -X GET "https://ymmquoyqufitfscmyvjp.supabase.co/rest/v1/outdoors?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"